[package]
name = "uor-mcp-notary-reference"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Self-hostable zero-payload Reference Blind Notary implementing HostEffect E1-E7, DSSE PAE signing, and C2SP tlog-checkpoints."
repository = "https://github.com/UOR-Foundation/uor-mcp-notary"

[[bin]]
name = "uor-notary-reference"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "pkcs8"] }
hex = "0.4"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
