[package]
name = "uor-mcp-notary-sidecar"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Thin local zero-trust MCP sidecar proxy and lockfile pin manager delegating all semantic rules to prism_mcp_notary_core_wasm."
repository = "https://github.com/UOR-Foundation/uor-mcp-notary"

[[bin]]
name = "uor-notary"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "time", "sync"] }
wasmtime = "29.0"
